name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Run checks
        run: make check PYTHON=/usr/bin/python3

  helper-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AppImage smoke-test display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build pinned umipcompatd source
        run: python3 packaging/build-umipcompatd.py
      - name: Verify helper release inputs
        run: |
          test -x build/release-assets/umipcompatd/umipcompatd
          test -s build/release-assets/umipcompatd/umipcompatd-source.tar.gz
          test -s build/release-assets/umipcompatd/LICENSE
      - name: Build AppImage in pinned container
        run: python3 packaging/build-appimage.py
      - name: Verify AppImage artifact
        run: |
          app=$(echo dist/HV-Installer-GTK-*-x86_64.AppImage)
          test -x "$app"
          (cd dist && sha256sum --check HV-Installer-GTK-*-x86_64.AppImage.sha256)
          APPIMAGE_EXTRACT_AND_RUN=1 "$app" --backend logs >/dev/null
          work=$(mktemp -d)
          (cd "$work" && "$GITHUB_WORKSPACE/$app" --appimage-extract >/dev/null && \
            test -x squashfs-root/usr/bin/python3 && \
            test -f squashfs-root/usr/lib/hv-installer-gtk/cpuid_fault_emulation/Makefile && \
            test -s squashfs-root/usr/lib/hv-installer-gtk/umipcompatd/umipcompatd-source.tar.gz && \
            xvfb-run -a env \
              PYTHONHOME="$PWD/squashfs-root/usr" \
              PYTHONPATH="$PWD/squashfs-root/usr/lib/python3/dist-packages" \
              LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib/x86_64-linux-gnu:$PWD/squashfs-root/usr/lib" \
              GI_TYPELIB_PATH="$PWD/squashfs-root/usr/lib/x86_64-linux-gnu/girepository-1.0" \
              GSETTINGS_SCHEMA_DIR="$PWD/squashfs-root/usr/share/glib-2.0/schemas" \
              "$PWD/squashfs-root/usr/bin/python3" -c 'import importlib.util; path = "squashfs-root/usr/lib/hv-installer-gtk/hv-installer-gui.py"; spec = importlib.util.spec_from_file_location("hv_appimage_smoke", path); gui = importlib.util.module_from_spec(spec); spec.loader.exec_module(gui); gui.Gtk.init(); window = gui.OperationWindow(None, "Smoke"); assert isinstance(window.spinner, gui.Gtk.Spinner); window.destroy()')
          rm -rf "$work"
